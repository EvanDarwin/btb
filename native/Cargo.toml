[package]
name = "btb_native"
version = "0.1.0"
edition = "2021"
authors = ["Evan Darwin <evan@relta.net>"]
license = "FSL-1.1-ALv2"
description = "Native C-ABI kernels for Beyond the Box"

# cdylib: the C-ABI shared library the Python datapath loads via ctypes.
# rlib:   so the integration tests can link it as a normal crate.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# rayon parallelizes the mat-vec across output rows and the DeltaNet step across
# (node, key head). The partition is a scheduling choice only: both kernels are
# bit-identical for every thread count.
rayon = "1"

[dev-dependencies]
# Per-op benches (`native/benches/`, one group per fused kernel). Each bench sets
# `harness = false` and drives criterion itself.
criterion = "0.5"

# The guard-page fence (`tests/common/mod.rs`) maps its pages with mmap/mprotect off Windows.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# One `[[bench]]` per op family, all custom-harness. The benches build inputs with the parity
# tests' generators (`tests/common/refs.rs`, `fixture.rs`) included by path, so core is untouched.
[[bench]]
name = "gemv"
harness = false

[[bench]]
name = "attn"
harness = false

[[bench]]
name = "delta"
harness = false

[[bench]]
name = "sample"
harness = false

[[bench]]
name = "direct"
harness = false

# Whole-crate inlining across the `#[target_feature]` task bodies and no per-CGU
# duplication of the hot loops. No `target-cpu` flag: the SIMD paths are selected at
# runtime by `is_x86_feature_detected!`, so one binary runs the AVX-512, AVX2 or
# scalar kernel on whatever machine loads it.
[profile.release]
lto = "thin"
codegen-units = 1

# `cargo test --profile guard`: the release codegen (thin LTO, one codegen unit) for the fenced
# kernel tests, built into target/guard so the release DLL a running process may hold is never
# rewritten.
[profile.guard]
inherits = "release"
debug = 1
