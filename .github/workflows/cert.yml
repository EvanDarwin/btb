# The certification report. Renders the cert state (tests/cert/comment.py: what the PR closed, coverage, gaps)
# into the job summary and, on a PR, a sticky comment, prints the matrices, then runs the torch-free checks.
# The checks report certification gaps and drift and publish the receipt; they never fail CI. The checks that
# need torch run against the wheel in wheels.yml. Model-free, CPU-only, fast.
#
# The PR's code runs in the `prep` and `report` jobs, which hold a read-only token. Posting the comment needs
# pull-requests: write, so it is a separate job that checks out nothing and runs no repo code. A receipt pasted
# into a comment after a run re-runs `report` alone (cert-rerun.yml), over the `prep` its run made for the commit.
name: cert

on:
  push:
    branches: [main]
    paths:
      [
        "tests/cert/**",
        "btb/kinds.py",
        "btb/options.py",
        "btb/engine/**",
        "btb/hf.py",
        "btb/serve.py",
        "btb/session.py",
        "btb/text.py",
        "btb/tools.py",
        "btb/mlx/**",
        "native/**",
        "tests/fixtures/**",
        "tests/make_fixtures.py",
      ]
  pull_request:
    paths:
      [
        "tests/cert/**",
        "btb/kinds.py",
        "btb/options.py",
        "btb/engine/**",
        "btb/hf.py",
        "btb/serve.py",
        "btb/session.py",
        "btb/text.py",
        "btb/tools.py",
        "btb/mlx/**",
        "native/**",
        "tests/fixtures/**",
        "tests/make_fixtures.py",
      ]

concurrency:
  group: cert-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # what a commit's report stands on, made once a commit: the native library, the derived GGUF twins and the base
  # branch's findings, handed to `report` as an artifact a re-run of `report` reads again
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The manifests import only kinds/hf/spec + gguf + numpy, no torch or engine, so no wheel is needed to
      # enumerate: the engine-dependent checks run in wheels.yml against the built wheel, and these jobs keep the
      # torch-free half
      - name: Install torch-free deps
        run: python -m pip install --quiet gguf numpy pytest transformers

      # the test suite refuses a run without the native library, so `report`'s gates need it built
      - name: Build the native library
        run: python build.py build --no-cuda --no-wheel

      # the GGUF twins the cells bind are derived from the committed fixtures and never committed (tests/cert/spec.py
      # derived_gguf); their writer is the one step that needs torch, the CPU wheel
      - name: Write the derived GGUF twins
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet safetensors
          python -m tests.make_fixtures gguf_twins

      # the PR's base branch, whose own findings say what this PR closed; a base that predates tests/cert/delta.py
      # has none, and the comment leaves the section out
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: The base branch's findings
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          # a base that derives its GGUF twins writes them first, so its findings bind them as this branch's do
          if grep -q '"gguf_twins"' tests/make_fixtures.py; then python -m tests.make_fixtures gguf_twins; fi
          if [ -f tests/cert/delta.py ]; then python -m tests.cert.delta bank --out ../base-findings.json
          else echo "the base predates tests/cert/delta.py; nothing to compare"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-prep
          path: |
            btb/native/
            tests/fixtures/gguf/
            base-findings.json
          retention-days: 7
          overwrite: true

  report:
    needs: prep
    runs-on: ubuntu-latest
    # read-only; pull-requests: read lists the PR's comments for the receipts pasted there
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # transformers installs without torch (its frameworks are optional); test_deps only reads its metadata
      - name: Install torch-free deps
        run: python -m pip install --quiet gguf numpy pytest transformers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cert-prep

      # Coverage is the UNION of receipts (tests/cert/receipt.py) and receipts are deliberately not committed, so
      # the run collects the ones pasted into the PR (a contributor's GPU box, their Mac): its body's, and those in
      # comments by its author or a maintainer, each contributor's latest per machine. Both are read as they stand
      # now, not as the event saw them: a re-run collects a receipt posted since. The token reaches only the fetch,
      # which runs no repo code.
      - name: Fetch the PR's body and comments
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.txt"
          gh api "repos/$REPO/issues/$PR/comments" --paginate > "$RUNNER_TEMP/pr-comments.json"

      # They land in one dir and BTB_CERT_RECEIPTS points the later steps at it. The body and comments are untrusted
      # input: they reach python only through the environment and a file (never interpolated into this script,
      # which would be shell injection) and are parsed as data, never executed.
      - name: Collect coverage receipts
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          dir=$(mktemp -d)
          echo "BTB_CERT_RECEIPTS=$dir" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/pr-body.txt" "$RUNNER_TEMP/pr-comments.json"
          PR_BODY=$(cat "$RUNNER_TEMP/pr-body.txt") python -m tests.cert.receipt --collect "$dir" \
            --comments "$RUNNER_TEMP/pr-comments.json"
          echo "receipts in $dir:"; ls -1 "$dir" || true

      # before the gates, so the comment renders whatever they find
      - name: Generate gaps commentary
        run: |
          python -m tests.cert.comment $([ -f base-findings.json ] && echo "--base base-findings.json") --out cert-comment.md
          cat cert-comment.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-comment
          path: cert-comment.md
          retention-days: 1
          overwrite: true

      - name: Model-cell matrix
        run: python -m tests.cert.manifest --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Native-op matrix
        run: python -m tests.cert.native_ops --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CUDA card-kernel matrix
        run: python -m tests.cert.cuda_ops --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: MLX kernel matrix
        run: python -m tests.cert.mlx_ops --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tool-call parser matrix
        run: python -m tests.cert.tool_ops --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Server route matrix
        run: python -m tests.cert.serve_ops --report | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs the coverage gate that detects drift or gaps in implementations between new families, their native
      # ops, parsers, routes, or other abstract gaps. This job fails open, but still generates the detailed receipt
      # which is rendered in the PR comment.
      - name: Gate - model-cell manifest
        continue-on-error: true
        run: python -m tests.cert.manifest --check

      # fails only on a gap the base branch did not have, so closing gaps never needs a list edited
      - name: Gate - no new gaps vs the base branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          if [ -f base-findings.json ]; then python -m tests.cert.delta check --baseline base-findings.json
          else echo "the base predates tests/cert/delta.py; nothing to compare"; fi

      - name: Gate - native ops
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m tests.cert.native_ops --check

      - name: Gate - CUDA card kernels
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m tests.cert.cuda_ops --check

      - name: Gate - MLX kernels
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m tests.cert.mlx_ops --check

      - name: Gate - tool-call parsers
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m tests.cert.tool_ops --check

      - name: Gate - server routes
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m tests.cert.serve_ops --check

      - name: Gate - matrix unit tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -m pytest tests/cert/test_manifest.py tests/cert/test_native_ops.py tests/cert/test_cuda_ops.py tests/cert/test_comment.py \
            tests/cert/test_mlx_ops.py tests/cert/test_tool_ops.py tests/cert/test_serve_ops.py \
            tests/cert/test_deps.py -q

      # the oracle's derivation + staleness gates are torch-free (the reproducibility gate needs the engine
      # and runs against the wheel in wheels.yml, with the runner's correctness assertions)
      - name: Gate - oracle derivation and staleness
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m pytest tests/cert/test_oracle.py -k "not reproducible" -q

  # the only job with a write token: no checkout, no repo code, just the rendered file and the API. It runs
  # whether or not the gates passed - the gaps are what the comment is for
  comment:
    if: github.event_name == 'pull_request' && !cancelled()
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cert-comment
      # upserts the bot's own marked comment (anyone can post the marker)
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- btb-cert-gaps -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@cert-comment.md >/dev/null && echo "updated $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@cert-comment.md >/dev/null && echo "posted"
          fi
