# Dependabot. Version updates only for the SHA-pinned actions in .github/workflows/ (a pin cannot be broad and
# goes stale). The Python and Rust dependencies are ranges on purpose, so their version updates are off
# (`open-pull-requests-limit: 0`); security updates still open a PR for a vulnerable version - those are
# enabled per repository under Settings > Code security, not here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
